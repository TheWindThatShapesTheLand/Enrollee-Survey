<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Опрос</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<main class="page">
    <header class="page__header">
        <h1 class="page__title">Ответь на вопросы</h1>
        <p class="page__subtitle">Это займёт несколько минут</p>
    </header>

    <form id="quiz-form" method="POST" autocomplete="off">

        <div class="field">
            <label class="field__label" for="age">Сколько тебе лет?</label>
            <select class="field__select" id="age" name="age" required>
                <option value="" disabled selected> </option>
                <option value="Меньше 14">Меньше 14</option>
                <option value="14-16">14-16</option>
                <option value="17-18">17-18</option>
                <option value="19+">19+</option>
            </select>
        </div>

        {% for question in questions %}
        <div class="field">
            <label class="field__label" for="answer_{{ loop.index0 }}">{{ question }}</label>
            <textarea class="field__input"
                      id="answer_{{ loop.index0 }}"
                      name="answer_{{ loop.index0 }}"
                      rows="3"
                      required></textarea>
        </div>
        {% endfor %}

        <div class="field">
            <label class="field__label" for="clearance_rating">Оцени, насколько формулировка вопросов выше была чёткой и понятной.</label>
            <select class="field__select" id="clearance_rating" name="clearance_rating" required>
                <option value="" disabled selected> </option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>
        </div>

        <div class="field">
            <label class="field__label" for="interest_rating">Оцени, насколько отвечать на вопросы выше было интересно.</label>
            <select class="field__select" id="interest_rating" name="interest_rating" required>
                <option value="" disabled selected> </option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>
        </div>

        <div class="actions">
            <button id="submit-button" type="submit" class="btn">Отправить</button>
        </div>

    </form>
</main>
    
<script>
    
document.getElementById("quiz-form").addEventListener("submit", function() {

    const button = document.getElementById("submit-button");

    button.disabled = true;

    button.innerText = "Отправка...";

});
    
const inputs = document.querySelectorAll("textarea");
inputs.forEach(input => {

 input.value = localStorage.getItem(input.id) || "";

    input.addEventListener("input", () => {
        localStorage.setItem(input.id, input.value);
    });
    
});

const selects = document.querySelectorAll("select");
selects.forEach(select => {

 select.value = localStorage.getItem(select.id) || "";

    select.addEventListener("change", () => {
        localStorage.setItem(select.id, select.value);
    });

});

document.getElementById("quiz-form").addEventListener("submit", () => {

    localStorage.clear();

});

window.addEventListener("pageshow", function(event) {

    // если страница восстановлена из кеша браузера
    if (event.persisted) {

        // очищаем форму
        document.getElementById("quiz-form").reset();

        // очищаем localStorage
        localStorage.clear();
    }

});
</script>

</body>
</html>
